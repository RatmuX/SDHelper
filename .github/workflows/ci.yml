name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-core:
    name: Android, core and checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check (tests, lint, style, architecture rules) and assemble
        run: ./gradlew check :app:android:assembleM3Debug --stacktrace
      - name: Build-logic tests
        run: ./gradlew -p build-logic test

  agent-windows:
    name: Agent (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the agent
        run: ./gradlew :core:protocol:test :agent:core:test :agent:desktop-app:build --stacktrace
